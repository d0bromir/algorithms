class: GalaxyWorkflow
label: WES tertiary analysis from FASTQ (v1)
release: "0.16"
license: MIT
tags:
  - WES
  - exome
  - germline
  - variant-calling
  - variant-annotation
  - variant-prioritization
  - tertiary-analysis
doc: |
  Germline whole exome sequencing (WES) analysis from paired-end FASTQ to a prioritised, annotated variant table.

  Runs once per sample of a list:paired collection (element identifiers are used as sample names):

  1. Read QC (FastQC) and adapter/quality trimming (fastp).
  2. Alignment to the reference with BWA-MEM (read groups set from the sample name), duplicate marking
     (Picard MarkDuplicates) and alignment statistics (samtools stats).
  3. Exome capture QC: Picard CollectHsMetrics (on-target rate, fold-80, % target bases >= 20x), per-target
     coverage with mosdepth (bases at 1/10/20/30/50x per target, for gap analysis) and per-gene coverage of the
     coding exons (mosdepth over the coding-region BED).
  4. Germline variant calling with FreeBayes (standard input filters: MAPQ >= 30, BQ >= 20), and copy-number calls
     (deletions, duplications, chromosome dosage) from each sample's target read depth against the other samples of
     the run and an optional reference panel of the same kit (needs at least 3 other samples).
  5. Tertiary analysis, the embedded "WES tertiary analysis from VCF (v2)" workflow: normalisation, restriction
     to the padded targets, quality filtering, ClinVar + gnomAD + SnpEff annotation, prioritisation and tables,
     runs of homozygosity, and the clinical interpretation report (diagnostic, candidate, ACMG secondary,
     carrier, pharmacogenomic and risk-allele findings, with read depth and coverage from this workflow).
  6. One MultiQC report for all samples (FastQC, fastp, Picard, samtools, bcftools stats, SnpEff).

  Reference FASTA, target BED, ClinVar and gnomAD must use the same genome build and chromosome naming.

inputs:
  "Paired-end reads":
    type: collection
    collection_type: list:paired
    format: [fastqsanger, fastqsanger.gz]
    doc: >-
      list:paired collection with one element per sample (forward/reverse FASTQ). The element identifier
      becomes the sample name in the BAM read groups and the VCF.
    position: {left: 0, top: 0}
  "Reference genome (FASTA)":
    type: data
    format: [fasta]
    doc: Reference genome (uncompressed FASTA), e.g. GRCh38/hg38 without ALT contigs (analysis set).
    position: {left: 0, top: 140}
  "Exome target regions (BED)":
    type: data
    format: [bed]
    doc: Exome capture target regions (BED) of the enrichment kit, same genome build as the reference.
    position: {left: 0, top: 280}
  "Target padding (bp)":
    type: int
    default: 50
    doc: Bases added on both sides of every target region before restricting the calls (keeps splice-site variants).
    position: {left: 0, top: 420}
  "SnpEff database":
    type: data
    format: [snpeffdb]
    doc: SnpEff genome database (SnpEff 5.x), e.g. GRCh38.105 created with the "SnpEff download" tool.
    position: {left: 0, top: 560}
  "ClinVar (VCF)":
    type: data
    format: [vcf, vcf_bgzip, bcf]
    doc: ClinVar VCF (clinvar.vcf.gz from NCBI) for the same build. Chromosome names must match the reference.
    position: {left: 0, top: 700}
  "Population allele frequencies (VCF)":
    type: data
    format: [vcf, vcf_bgzip, bcf]
    doc: >-
      gnomAD v4.1 joint (exome + genome) frequencies reduced to the padded targets, as an indexed BCF built with
      data/build_gnomad_extract.sh: INFO/gnomAD_AF, _AN, _nhomalt, _grpmax, _grpmax_AF, _grpmax_AN, _FAF95,
      _FAF95_grp, _filter and _discordance_p (see README).
    position: {left: 0, top: 840}
  "Quality filter (bcftools expression)":
    type: string
    default: '(FILTER="PASS" || FILTER=".") && QUAL>=20 && FMT/DP>=10'
    doc: bcftools filter --include expression applied to on-target calls (records failing it are removed).
    position: {left: 0, top: 980}
  "Prioritization filter (SnpSift expression)":
    type: string
    default: >-
      (CLNSIG =~ 'athogenic') | (((ANN[*].IMPACT = 'HIGH') | (ANN[*].IMPACT = 'MODERATE')) &
      ((! exists gnomAD_AF) | (gnomAD_AF < 0.01)) & ((! exists gnomAD_FAF95) | (gnomAD_FAF95 < 0.01)))
    doc: SnpSift filter expression that selects candidate variants from the annotated calls.
    position: {left: 0, top: 1120}
  "Coding regions (BED)":
    type: data
    format: [bed]
    doc: >-
      Coding exons with the gene symbol in column 4 (e.g. Ensembl canonical CDS, see README), same build and
      chromosome naming as the reference. Used for per-gene coverage in the clinical report.
    position: {left: 0, top: 1260}
  "Gene-disease validity (GenCC TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: GenCC submissions export (https://search.thegencc.org/download); diseases and mode of inheritance per gene.
    position: {left: 0, top: 1400}
  "Gene constraint (gnomAD TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: gnomAD v4.1 constraint metrics (LOEUF, pLI, missense Z).
    position: {left: 0, top: 1540}
  "HPO gene annotations (phenotype_to_genes.txt)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: HPO release file phenotype_to_genes.txt; used with the patient's HPO terms.
    position: {left: 0, top: 1680}
  "Patient phenotype (HPO terms)":
    type: string
    optional: true
    doc: Comma-separated HPO term ids describing the patient (e.g. HP:0001250, HP:0001263); ranks candidates.
    position: {left: 0, top: 1820}
  "Recurrent artefacts (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: >-
      Recurrent artefacts of the laboratory: alleles called in many of its own samples (same kit, sequencer and
      pipeline) but rare or absent in gnomAD, built with data/build_artefact_list.sh. The report marks matching
      calls low confidence; without it, recurrent false calls (e.g. in GC-rich targets) are not recognised.
    position: {left: 0, top: 1960}
  "Missense predictions (AlphaMissense BCF)":
    type: data
    format: [bcf, vcf_bgzip]
    doc: >-
      AlphaMissense hg38 predictions as an indexed BCF with INFO/AM_score, built with data/build_alphamissense.sh
      (CC BY 4.0). Gives the missense PP3/BP4 evidence of the report at the ClinGen-calibrated strengths.
    position: {left: 0, top: 2100}
  "HPO disease annotations (phenotype.hpoa)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      HPO release file phenotype.hpoa: disease names, age of onset, clinical course and inheritance; with the
      patient's HPO terms, the report shows the disease that best explains the phenotype for each gene.
    position: {left: 0, top: 2240}
  "Dosage sensitivity (ClinGen TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      ClinGen gene curation list (https://ftp.clinicalgenome.org/ClinGen_gene_curation_list_GRCh38.tsv):
      haploinsufficiency and triplosensitivity scores, used to decide whether loss of function is a disease mechanism.
    position: {left: 0, top: 2380}
  "ClinVar missense by residue (TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      Pathogenic and benign ClinVar missense variants by protein residue, built from variant_summary.txt.gz with
      data/build_clinvar_protein.py: ACMG PS1 (same amino-acid change pathogenic) and PM5 (another pathogenic change
      at the residue).
    position: {left: 0, top: 2520}
  "Mother: variant calls (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: >-
      The mother's calls on the same reference, e.g. the Raw variant calls of the FASTQ workflow run on her reads.
      With both parents the report adds de novo variants, the parental origin of every finding, compound
      heterozygotes phased by origin and a parentage check.
    position: {left: 0, top: 2660}
  "Father: variant calls (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: The father's calls on the same reference.
    position: {left: 0, top: 2800}
  "Mother: aligned reads (BAM)":
    type: data
    format: [bam]
    optional: true
    doc: The mother's BAM; confirms a de novo variant by her reference reads, and finds alleles her calls missed.
    position: {left: 0, top: 2940}
  "Father: aligned reads (BAM)":
    type: data
    format: [bam]
    optional: true
    doc: The father's BAM.
    position: {left: 0, top: 3080}
  "Affected parents":
    type: string
    default: unknown
    restrictions: [unknown, none, mother, father, both]
    doc: >-
      Whether a parent has the proband's condition (unknown, none, mother, father, both). A dominant candidate
      inherited from an unaffected parent does not count as fitting the inheritance.
    position: {left: 0, top: 3220}
  "CNV reference panel (per-target depth)":
    type: collection
    collection_type: list
    format: [bed, tabular]
    optional: true
    doc: >-
      Per-target mean depth (the "Per-target mean depth (mosdepth)" output) of earlier samples of the same kit,
      sequencer and pipeline. CNVs are called against the other samples of this run plus these; at least 3 are
      needed, more give better calls.
    position: {left: 0, top: 3360}
  "Segmental duplications (BED)":
    type: data
    format: [bed]
    optional: true
    doc: >-
      Segmental duplications of the reference (GIAB GRCh38_segdups.bed.gz, see README): CNV calls mostly inside them
      are marked low confidence.
    position: {left: 0, top: 3500}
  "ClinGen dosage regions (TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      ClinGen region curation list (https://ftp.clinicalgenome.org/ClinGen_region_curation_list_GRCh38.tsv):
      recurrent CNV regions (e.g. 22q11.2) and population regions where dosage sensitivity is unlikely.
    position: {left: 0, top: 3640}
  "Mother: CNV per-target ratios":
    type: data
    format: [tabular]
    optional: true
    doc: The mother's "CNV per-target ratios" from this workflow run on her reads; tells inherited from de novo CNVs.
    position: {left: 0, top: 3780}
  "Father: CNV per-target ratios":
    type: data
    format: [tabular]
    optional: true
    doc: The father's "CNV per-target ratios".
    position: {left: 0, top: 3920}
  "Previous report: findings (TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      The "Clinical findings (table)" of an earlier run on the same sample: the report then lists what is new,
      changed or no longer reported since, with the evidence that differs (reanalysis).
    position: {left: 0, top: 4060}
  "MANE transcripts (summary)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      MANE.GRCh38.v1.x.summary.txt.gz from NCBI: variants are named and classified on the MANE Select transcript,
      with the paired RefSeq NM_/NP_ names.
    position: {left: 0, top: 4180}
  "Curated gene-disease table":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen gene-disease validity, Gene2Phenotype and Orphanet merged by data/build_gene_disease.py: inheritance and
      disease mechanism per disease, and the disease-context section of the report.
    position: {left: 0, top: 4300}
  "ClinGen expert-panel rules (VCEP)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen CSpec criteria specifications built by data/build_vcep.py: the expert panels' gene-specific frequency
      cut-offs, criteria and strengths replace the default ACMG rules for their genes.
    position: {left: 0, top: 4420}
  "ClinGen expert-panel classifications (ERepo)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen Evidence Repository classifications built by data/build_vcep.py, shown with their met criteria next to
      ClinVar.
    position: {left: 0, top: 4540}
  "Predicted dosage sensitivity (Collins TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      Collins et al. 2022 pHaplo/pTriplo scores (Collins_rCNV_2022.dosage_sensitivity_scores.tsv.gz, CC BY 4.0):
      predicted haploinsufficient and triplosensitive genes in a copy-number variant.
    position: {left: 0, top: 4660}
  "Functional assays (MaveDB TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      Calibrated multiplexed functional assays from MaveDB (CC0), built by data/build_mavedb.py: PS3/BS3 at the
      calibrated strength for the variants an assay measured.
    position: {left: 0, top: 4780}
  "Mitochondrial frequencies (gnomAD chrM VCF)":
    type: data
    format: [vcf_bgzip, vcf]
    optional: true
    doc: >-
      gnomad.genomes.v3.1.sites.chrM.vcf.bgz (CC0) with chrM renamed to the reference's name (install.sh does this):
      mtDNA frequencies, haplogroup-defining flags and tRNA predictions for the mitochondrial calls.
    position: {left: 0, top: 4900}
  "Population CNVs (gnomAD exome CNV VCF)":
    type: data
    format: [vcf_bgzip, vcf]
    optional: true
    doc: >-
      gnomad.v4.1.cnv.all.vcf.gz (rare CNVs of 464,297 exomes, CC0): the population frequency of each CNV call.
    position: {left: 0, top: 5020}
  "Protein features (UniProt TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      UniProtKB/Swiss-Prot domains, regions, motifs and sites by Ensembl transcript, built by
      data/build_uniprot_features.py (CC BY 4.0): shown at each variant's residue.
    position: {left: 0, top: 5140}
  "gnomAD exome coverage (runs)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      gnomAD v4.0 exome coverage reduced to the exome regions by data/build_gnomad_sites.py coverage (CC0): an allele
      absent from gnomAD gets PM2 only where at least half of gnomAD exomes reached 20x.
    position: {left: 0, top: 5260}
  "Exon expression, pext (runs)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      gnomAD GTEx v10 base-level pext reduced to the exome regions by data/build_gnomad_sites.py pext (CC0): shown next
      to loss-of-function variants.
    position: {left: 0, top: 5380}
  "HLA alleles (IPD-IMGT/HLA hla.dat)":
    type: data
    format: [txt]
    optional: true
    doc: >-
      hla.dat of an IPD-IMGT/HLA release (https://ftp.ebi.ac.uk/pub/databases/ipd/imgt/hla/, CC BY-ND 4.0; the
      install script's data stage downloads it): HLA typing of the sample's reads with T1K. Without it the HLA genes
      are not typed.
    position: {left: 0, top: 5500}
  "KIR alleles (IPD-KIR kir.dat)":
    type: data
    format: [txt]
    optional: true
    doc: >-
      kir.dat of an IPD-KIR release (https://ftp.ebi.ac.uk/pub/databases/ipd/kir/, CC BY-ND 4.0; the install script's
      data stage downloads it): KIR gene content of the sample's reads with T1K. Without it the KIR genes are not
      typed.
    position: {left: 0, top: 5620}

outputs:
  multiqc_report:
    outputSource: multiqc/html_report
  multiqc_stats:
    outputSource: multiqc/stats
  deduplicated_bam:
    outputSource: mark_duplicates/outFile
  hs_metrics:
    outputSource: hs_metrics/outFile
  target_coverage_summary:
    outputSource: target_coverage/output_summary
  target_coverage_thresholds:
    outputSource: target_coverage/output_thresholds_bed
  target_mean_depth:
    outputSource: target_coverage/output_regions_bed
  mito_calls:
    outputSource: mito_calling/calls
  mito_summary:
    outputSource: mito_calling/summary
  hla_types:
    outputSource: hla_typing/types
  hla_summary:
    outputSource: hla_typing/summary
  yhaplo_summary:
    outputSource: y_haplogroup/summary
  kir_genes:
    outputSource: kir_typing/genes
  kir_summary:
    outputSource: kir_typing/summary
  yhaplo_lineage:
    outputSource: y_haplogroup/lineage
  cnv_calls:
    outputSource: cnv_calling/calls
  cnv_targets:
    outputSource: cnv_calling/targets
  cnv_summary:
    outputSource: cnv_calling/summary
  raw_vcf:
    outputSource: variant_calling/output_vcf
  annotated_vcf:
    outputSource: tertiary/annotated_vcf
  annotated_table:
    outputSource: tertiary/annotated_table
  candidate_vcf:
    outputSource: tertiary/candidate_vcf
  candidate_table:
    outputSource: tertiary/candidate_table
  snpeff_summary:
    outputSource: tertiary/snpeff_summary
  variant_stats:
    outputSource: tertiary/variant_stats
  coding_coverage_thresholds:
    outputSource: coding_coverage/output_thresholds_bed
  runs_of_homozygosity:
    outputSource: tertiary/runs_of_homozygosity
  clinical_report:
    outputSource: tertiary/clinical_report
  clinical_findings:
    outputSource: tertiary/clinical_findings
  pharmcat_report:
    outputSource: tertiary/pharmcat_report
  pharmcat_calls:
    outputSource: tertiary/pharmcat_calls

steps:
  fastqc_raw:
    doc: Quality control of the raw reads.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    position: {left: 300, top: 0}
    in:
      input_file: "Paired-end reads"
    state:
      nogroup: false
      kmers: 7
    out:
      html_file: {rename: "FastQC report"}
      text_file: {hide: true}

  flatten_fastqc:
    doc: Flatten the per-sample/per-mate FastQC results into one list for MultiQC.
    tool_id: __FLATTEN__
    tool_version: 1.0.0
    position: {left: 560, top: 0}
    in:
      input: fastqc_raw/text_file
    state:
      join_identifier: _
    out:
      output: {hide: true}

  trimming:
    doc: Adapter and quality trimming (fastp, paired-end adapter detection).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.4.0+galaxy0
    tool_version: 1.4.0+galaxy0
    position: {left: 300, top: 220}
    in:
      single_paired|paired_input: "Paired-end reads"
    state:
      single_paired:
        single_paired_selector: paired_collection
        merge_reads:
          merge: ""
        adapter_trimming_options:
          disable_adapter_trimming: false
          detect_adapter_for_pe: true
      output_options:
        report_html: true
        report_json: true
    out:
      output_paired_coll: {hide: true}
      report_html: {rename: "fastp report"}
      report_json: {hide: true}

  mapping:
    doc: >-
      Align with BWA-MEM. The index is built from the history FASTA inside each job; switch "Reference genome"
      to a built-in (cached) BWA index in this step to skip indexing on servers that have one.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/0.7.19+galaxy2
    tool_version: 0.7.19+galaxy2
    position: {left: 560, top: 220}
    in:
      reference_source|ref_file: "Reference genome (FASTA)"
      fastq_input|fastq_input1: trimming/output_paired_coll
    state:
      reference_source:
        reference_source_selector: history
        index_a: auto
      fastq_input:
        fastq_input_selector: paired_collection
        iset_stats: ""
      rg:
        rg_selector: set
        read_group_id_conditional:
          do_auto_name: "true"
        read_group_sm_conditional:
          do_auto_name: "true"
        read_group_lb_conditional:
          do_auto_name: "true"
        PL: ILLUMINA
        CN: ""
        DS: ""
        DT: ""
        FO: ""
        KS: ""
        PG: ""
        PI: null
        PU: ""
      analysis_type:
        analysis_type_selector: illumina
      output_sort: coordinate
    out:
      bam_output: {hide: true}

  mark_duplicates:
    doc: Mark PCR/optical duplicates (kept in the BAM, flagged 0x400; FreeBayes ignores them).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_MarkDuplicates/3.1.1.0
    tool_version: 3.1.1.0
    position: {left: 820, top: 220}
    in:
      inputFile: mapping/bam_output
    state:
      remove_duplicates: false
      assume_sorted: true
      duplicate_scoring_strategy: SUM_OF_BASE_QUALITIES
      read_name_regex: ""
      optical_duplicate_pixel_distance: 100
      barcode_tag: ""
      validation_stringency: LENIENT
    out:
      outFile: {rename: "Aligned reads (duplicates marked)"}
      metrics_file: {hide: true}

  alignment_stats:
    doc: Alignment statistics for MultiQC.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    position: {left: 1080, top: 120}
    in:
      input: mark_duplicates/outFile
    state:
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      addref_cond:
        addref_select: "no"
      cond_region:
        select_region: "no"
      sparse: false
      remove_overlaps: false
    out:
      output: {hide: true}

  target_intervals:
    doc: Convert the target BED to a Picard interval list (sequence dictionary from the reference).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_BedToIntervalList/3.1.1.0
    tool_version: 3.1.1.0
    position: {left: 300, top: 440}
    in:
      reference_source|ref_file: "Reference genome (FASTA)"
      inputFile: "Exome target regions (BED)"
    state:
      reference_source:
        reference_source_selector: history
    out:
      outFile: {hide: true}

  hs_metrics:
    doc: Hybrid-selection (exome capture) metrics; the target BED is used as both bait and target intervals.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_CollectHsMetrics/3.1.1
    tool_version: 3.1.1
    position: {left: 1080, top: 320}
    in:
      inputFile: mark_duplicates/outFile
      baitFile: target_intervals/outFile
      targetFile: target_intervals/outFile
    state:
      minimum_mapping_quality: 20
      minimum_base_quality: 20
      coverage_cap: 200
      clip_overlapping_reads: true
      validation_stringency: LENIENT
    out:
      outFile: {rename: "Exome capture metrics (HsMetrics)"}

  target_coverage:
    doc: Per-target coverage (mosdepth) with the number of bases at 1/10/20/30/50x for each target.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/mosdepth/mosdepth/0.3.14+galaxy0
    tool_version: 0.3.14+galaxy0
    position: {left: 1080, top: 520}
    in:
      input_alignment: mark_duplicates/outFile
      window|region_file: "Exome target regions (BED)"
    state:
      per_base_coverage: false
      window:
        window_mode: bed
      advanced:
        options: "yes"
        chrom: ""
        exclude_flag: 1796
        no_fast: false
        fragment_mode: false
        mapq: 20
        thresholds: "1,10,20,30,50"
        use_median: false
        read_groups: ""
        quantize: []
    out:
      output_summary: {rename: "Coverage summary (mosdepth)"}
      output_thresholds_bed: {rename: "Per-target coverage thresholds (mosdepth)"}
      output_global_dist: {hide: true}
      output_region_dist: {hide: true}
      output_regions_bed: {rename: "Per-target mean depth (mosdepth)"}

  cnv_calling:
    doc: >-
      Copy-number calls of each sample from its targets' read depth against the other samples of this run (and the
      optional reference panel) of the same kit (local tool tools/wes_cnv; at least 3 other samples are needed).
    tool_id: wes_cnv
    tool_version: 0.1.0+galaxy0
    position: {left: 1340, top: 520}
    in:
      sample: target_coverage/output_regions_bed
      panel: target_coverage/output_regions_bed
      extra_panel: "CNV reference panel (per-target depth)"
      reference: "Reference genome (FASTA)"
      genes: "Coding regions (BED)"
      segdups: "Segmental duplications (BED)"
    state:
      advanced:
        min_depth: 20.0
        p_cnv: 0.0001
        min_bf: 3.0
        pcs: 1
    out:
      calls: {rename: "CNV calls"}
      targets: {rename: "CNV per-target ratios"}
      summary: {rename: "CNV summary"}

  coding_coverage:
    doc: Coverage of the coding exons, per exon with the gene name (bases at 1/10/20/30/50x), for per-gene coverage.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/mosdepth/mosdepth/0.3.14+galaxy0
    tool_version: 0.3.14+galaxy0
    position: {left: 1080, top: 720}
    in:
      input_alignment: mark_duplicates/outFile
      window|region_file: "Coding regions (BED)"
    state:
      per_base_coverage: false
      window:
        window_mode: bed
      advanced:
        options: "yes"
        chrom: ""
        exclude_flag: 1796
        no_fast: false
        fragment_mode: false
        mapq: 20
        thresholds: "1,10,20,30,50"
        use_median: false
        read_groups: ""
        quantize: []
    out:
      output_summary: {hide: true}
      output_thresholds_bed: {rename: "Per-exon coverage thresholds (mosdepth)"}
      output_global_dist: {hide: true}
      output_region_dist: {hide: true}
      output_regions_bed: {hide: true}

  variant_calling:
    doc: >-
      Germline calling with FreeBayes per sample, parallelised per chromosome. Calls are restricted to the
      padded targets afterwards (limiting FreeBayes by an exome BED would start one process per target).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/freebayes/freebayes/1.3.10+galaxy1
    tool_version: 1.3.10+galaxy1
    position: {left: 1340, top: 220}
    in:
      reference_source|batchmode|input_bams: mark_duplicates/outFile
      reference_source|ref_file: "Reference genome (FASTA)"
    state:
      reference_source:
        reference_source_selector: history
        batchmode:
          processmode: individual
      target_limit_type:
        target_limit_type_selector: do_not_limit
      coverage_options:
        coverage_options_selector: do_not_set
      options_type:
        options_type_selector: simple_w_filters
      output_options:
        flavor: vcf
    out:
      output_vcf: {rename: "Raw variant calls (FreeBayes)"}

  mito_calling:
    doc: >-
      Mitochondrial DNA variants and heteroplasmy from the off-target chrM reads, and the mtDNA haplogroup with
      HaploGrep3 (local tool tools/wes_mito).
    tool_id: wes_mito
    tool_version: 0.2.0+galaxy0
    position: {left: 1340, top: 820}
    in:
      bam: mark_duplicates/outFile
      reference: "Reference genome (FASTA)"
      gnomad_mt: "Mitochondrial frequencies (gnomAD chrM VCF)"
      clinvar: "ClinVar (VCF)"
    state:
      min_hl: 0.1
      min_alt: 3
      min_depth: 20
      min_depth_hom: 5
      haplogroup: true
    out:
      calls: {rename: "Mitochondrial calls"}
      summary: {rename: "Mitochondrial summary"}

  hla_typing:
    doc: >-
      HLA class I and II alleles from the reads of the HLA genes and the unmapped reads with T1K (local tool
      tools/wes_hla): CPIC pharmacogenomic HLA alleles, HLA disease associations, and PharmCAT outside calls.
    tool_id: wes_hla
    tool_version: 0.2.0+galaxy0
    position: {left: 1340, top: 1060}
    in:
      bam: mark_duplicates/outFile
      hla_dat: "HLA alleles (IPD-IMGT/HLA hla.dat)"
    state:
      min_quality: 20
    out:
      types: {rename: "HLA types"}
      summary: {rename: "HLA summary"}
      outside_calls: {rename: "HLA outside calls (PharmCAT)"}

  kir_typing:
    doc: >-
      KIR gene content, alleles, A/B genotype, B-content group and KIR-HLA ligand pairs from the reads of the KIR
      region and the unmapped reads with T1K (local tool tools/wes_kir).
    tool_id: wes_kir
    tool_version: 0.1.0+galaxy0
    position: {left: 1340, top: 1540}
    in:
      bam: mark_duplicates/outFile
      kir_dat: "KIR alleles (IPD-KIR kir.dat)"
      hla: hla_typing/summary
    state:
      min_quality: 0
      min_abundance: 0.1
    out:
      genes: {rename: "KIR genes"}
      summary: {rename: "KIR summary"}

  y_haplogroup:
    doc: >-
      Y-chromosome haplogroup with Yleaf (YFull and ISOGG trees) from the Y reads, after a Y/X read-ratio check
      (local tool tools/wes_yhaplo).
    tool_id: wes_yhaplo
    tool_version: 0.1.0+galaxy0
    position: {left: 1340, top: 1300}
    in:
      bam: mark_duplicates/outFile
      reference: "Reference genome (FASTA)"
    state:
      min_y_ratio: 0.05
      min_reads: 10
      prediction_quality: 0.95
    out:
      summary: {rename: "Y haplogroup summary"}
      lineage: {rename: "Y haplogroup lineage"}

  tertiary:
    doc: Tertiary analysis of each sample's VCF (embedded workflow "WES tertiary analysis from VCF (v2)").
    position: {left: 1600, top: 220}
    run:
      "@import": wes-tertiary-from-vcf.gxwf.yml
    in:
      "Variant calls (VCF)": variant_calling/output_vcf
      "Reference genome (FASTA)": "Reference genome (FASTA)"
      "Exome target regions (BED)": "Exome target regions (BED)"
      "Target padding (bp)": "Target padding (bp)"
      "SnpEff database": "SnpEff database"
      "ClinVar (VCF)": "ClinVar (VCF)"
      "Population allele frequencies (VCF)": "Population allele frequencies (VCF)"
      "Quality filter (bcftools expression)": "Quality filter (bcftools expression)"
      "Prioritization filter (SnpSift expression)": "Prioritization filter (SnpSift expression)"
      "Gene-disease validity (GenCC TSV)": "Gene-disease validity (GenCC TSV)"
      "Gene constraint (gnomAD TSV)": "Gene constraint (gnomAD TSV)"
      "HPO gene annotations (phenotype_to_genes.txt)": "HPO gene annotations (phenotype_to_genes.txt)"
      "Patient phenotype (HPO terms)": "Patient phenotype (HPO terms)"
      "Recurrent artefacts (VCF)": "Recurrent artefacts (VCF)"
      "Missense predictions (AlphaMissense BCF)": "Missense predictions (AlphaMissense BCF)"
      "HPO disease annotations (phenotype.hpoa)": "HPO disease annotations (phenotype.hpoa)"
      "Dosage sensitivity (ClinGen TSV)": "Dosage sensitivity (ClinGen TSV)"
      "ClinVar missense by residue (TSV)": "ClinVar missense by residue (TSV)"
      "Mother: variant calls (VCF)": "Mother: variant calls (VCF)"
      "Father: variant calls (VCF)": "Father: variant calls (VCF)"
      "Mother: aligned reads (BAM)": "Mother: aligned reads (BAM)"
      "Father: aligned reads (BAM)": "Father: aligned reads (BAM)"
      "Affected parents": "Affected parents"
      "Aligned reads (BAM)": mark_duplicates/outFile
      "Per-target coverage (mosdepth thresholds)": target_coverage/output_thresholds_bed
      "Coverage summary (mosdepth)": target_coverage/output_summary
      "Coding-exon coverage (mosdepth thresholds)": coding_coverage/output_thresholds_bed
      "Copy-number calls (wes_cnv TSV)": cnv_calling/calls
      "Copy-number summary (wes_cnv JSON)": cnv_calling/summary
      "ClinGen dosage regions (TSV)": "ClinGen dosage regions (TSV)"
      "Mother: CNV per-target ratios": "Mother: CNV per-target ratios"
      "Father: CNV per-target ratios": "Father: CNV per-target ratios"
      "Previous report: findings (TSV)": "Previous report: findings (TSV)"
      "MANE transcripts (summary)": "MANE transcripts (summary)"
      "Curated gene-disease table": "Curated gene-disease table"
      "ClinGen expert-panel rules (VCEP)": "ClinGen expert-panel rules (VCEP)"
      "ClinGen expert-panel classifications (ERepo)": "ClinGen expert-panel classifications (ERepo)"
      "Predicted dosage sensitivity (Collins TSV)": "Predicted dosage sensitivity (Collins TSV)"
      "Functional assays (MaveDB TSV)": "Functional assays (MaveDB TSV)"
      "Mitochondrial calls (wes_mito TSV)": mito_calling/calls
      "Mitochondrial summary (wes_mito JSON)": mito_calling/summary
      "Population CNVs (gnomAD exome CNV VCF)": "Population CNVs (gnomAD exome CNV VCF)"
      "Protein features (UniProt TSV)": "Protein features (UniProt TSV)"
      "gnomAD exome coverage (runs)": "gnomAD exome coverage (runs)"
      "Exon expression, pext (runs)": "Exon expression, pext (runs)"
      "HLA types (wes_hla summary)": hla_typing/summary
      "HLA outside calls (PharmCAT TSV)": hla_typing/outside_calls
      "Y haplogroup (wes_yhaplo summary)": y_haplogroup/summary
      "KIR genes (wes_kir summary)": kir_typing/summary

  multiqc:
    doc: One QC report for all samples.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    position: {left: 1860, top: 0}
    in:
      results_0|software_cond|output_0|input: flatten_fastqc/output
      results_1|software_cond|input: trimming/report_json
      results_2|software_cond|output_0|input: mark_duplicates/metrics_file
      results_2|software_cond|output_1|input: hs_metrics/outFile
      results_3|software_cond|output_0|type|input: alignment_stats/output
      results_4|software_cond|input: tertiary/variant_stats
      results_5|software_cond|input: tertiary/snpeff_csv_stats
    state:
      results:
        - software_cond:
            software: fastqc
            output:
              - type: data
        - software_cond:
            software: fastp
        - software_cond:
            software: picard
            output:
              - type: markdups
              - type: hsmetrics
        - software_cond:
            software: samtools
            output:
              - type:
                  type: stats
        - software_cond:
            software: bcftools
        - software_cond:
            software: snpeff
      title: WES QC report
      comment: ""
      flat: false
      export: false
    out:
      html_report: {rename: "MultiQC report"}
      stats: {rename: "MultiQC general statistics"}
