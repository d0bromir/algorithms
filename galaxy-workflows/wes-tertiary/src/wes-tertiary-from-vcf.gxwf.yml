class: GalaxyWorkflow
label: WES tertiary analysis from VCF (v2)
release: "0.16"
license: MIT
tags:
  - WES
  - exome
  - variant-annotation
  - variant-prioritization
  - tertiary-analysis
doc: |
  Tertiary analysis of a germline whole exome sequencing (WES) VCF.

  1. Normalise the calls against the reference: split multiallelic records, decompose complex alleles (MNVs)
     into SNVs/indels, left-align indels and drop records whose REF does not match the reference (bcftools norm).
  2. Keep calls inside the exome target regions, padded by a configurable number of bases so that
     canonical splice sites are retained, and that pass the quality expression (bcftools filter).
  3. Add ClinVar clinical significance (CLNSIG, CLNREVSTAT, CLNDN, CLNSIGCONF, ALLELEID) and the
     gnomAD v4.1 population frequencies (INFO/gnomAD_AF, grpmax AF, filtering AF FAF95, homozygote count, gnomAD
     filter and exome/genome discordance) and the AlphaMissense missense score (INFO/AM_score) with bcftools
     annotate; score the rare variants with SpliceAI (INFO/SpliceAI).
  4. Predict functional consequences (gene, effect, impact, HGVS c./p., LOF/NMD) with SnpEff.
  5. Prioritise candidates with a SnpSift expression. The default keeps ClinVar (likely) pathogenic
     variants at any frequency, plus rare (gnomAD AF and grpmax FAF95 < 1% or absent) HIGH/MODERATE impact variants.
  6. Export tab-separated tables of all annotated variants and of the candidates, and variant statistics
     (bcftools stats, SnpEff summary) for MultiQC.
  7. Runs of homozygosity (bcftools roh, using the population allele frequencies).
  8. Clinical interpretation report (HTML) and findings table: diagnostic ClinVar pathogenic/likely pathogenic
     findings checked against the gene's mode of inheritance (GenCC), candidate loss-of-function variants with
     automated ACMG/AMP evidence codes and optional HPO phenotype ranking, ACMG SF v3.3 secondary findings,
     copy-number variants with ClinGen dosage and CNV points (when the CNV calls are given),
     carrier status, pharmacogenomics (CPIC genes, and PharmCAT 3.4.0 diplotypes with its own HTML report), risk alleles, runs of homozygosity, coverage of clinically
     relevant genes and the limits of the analysis. The optional inputs (GenCC, gnomAD constraint, HPO, BAM,
     coverage) refine the report; the FASTQ workflow connects all of them.

  Map this workflow over a collection of VCFs to process a batch of samples.
  Reference FASTA, target BED, ClinVar and gnomAD must use the same genome build and the same
  chromosome naming (e.g. "chr1" vs "1") as the VCF.

inputs:
  "Variant calls (VCF)":
    type: data
    format: [vcf, vcf_bgzip, bcf]
    doc: Germline variant calls for one exome (VCF, bgzipped VCF or BCF).
    position: {left: 0, top: 0}
  "Reference genome (FASTA)":
    type: data
    format: [fasta]
    doc: Reference genome (uncompressed FASTA) that the variants were called against, e.g. GRCh38/hg38.
    position: {left: 0, top: 120}
  "Exome target regions (BED)":
    type: data
    format: [bed]
    doc: Exome capture target regions (BED) of the enrichment kit, same genome build as the reference.
    position: {left: 0, top: 240}
  "Target padding (bp)":
    type: int
    default: 50
    doc: Bases added on both sides of every target region before restricting the calls (keeps splice-site variants).
    position: {left: 0, top: 360}
  "SnpEff database":
    type: data
    format: [snpeffdb]
    doc: SnpEff genome database (SnpEff 5.x), e.g. GRCh38.105 created with the "SnpEff download" tool.
    position: {left: 0, top: 480}
  "ClinVar (VCF)":
    type: data
    format: [vcf, vcf_bgzip, bcf]
    doc: ClinVar VCF (clinvar.vcf.gz from NCBI) for the same build. Chromosome names must match the reference.
    position: {left: 0, top: 600}
  "Population allele frequencies (VCF)":
    type: data
    format: [vcf, vcf_bgzip, bcf]
    doc: >-
      gnomAD v4.1 joint (exome + genome) frequencies reduced to the padded targets, as an indexed BCF built with
      data/build_gnomad_extract.sh: INFO/gnomAD_AF, _AN, _nhomalt, _grpmax, _grpmax_AF, _grpmax_AN, _FAF95,
      _FAF95_grp, _filter and _discordance_p (see README).
    position: {left: 0, top: 720}
  "Quality filter (bcftools expression)":
    type: string
    default: '(FILTER="PASS" || FILTER=".") && QUAL>=20 && FMT/DP>=10'
    doc: bcftools filter --include expression applied to on-target calls (records failing it are removed).
    position: {left: 0, top: 840}
  "Prioritization filter (SnpSift expression)":
    type: string
    default: >-
      (CLNSIG =~ 'athogenic') | (((ANN[*].IMPACT = 'HIGH') | (ANN[*].IMPACT = 'MODERATE')) &
      ((! exists gnomAD_AF) | (gnomAD_AF < 0.01)) & ((! exists gnomAD_FAF95) | (gnomAD_FAF95 < 0.01)))
    doc: SnpSift filter expression that selects candidate variants from the annotated calls.
    position: {left: 0, top: 960}
  "Gene-disease validity (GenCC TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      GenCC submissions export (https://search.thegencc.org/download, CC0). Gives each gene's diseases and mode
      of inheritance; without it, inheritance is only known for ACMG SF genes.
    position: {left: 0, top: 1080}
  "Gene constraint (gnomAD TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: gnomAD v4.1 constraint metrics (LOEUF, pLI, missense Z) for loss-of-function intolerance.
    position: {left: 0, top: 1200}
  "HPO gene annotations (phenotype_to_genes.txt)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: HPO release file phenotype_to_genes.txt; used with the patient's HPO terms.
    position: {left: 0, top: 1320}
  "Patient phenotype (HPO terms)":
    type: string
    optional: true
    doc: Comma-separated HPO term ids describing the patient (e.g. HP:0001250, HP:0001263); ranks candidates.
    position: {left: 0, top: 1440}
  "Aligned reads (BAM)":
    type: data
    format: [bam]
    optional: true
    doc: >-
      BAM the VCF was called from. Gives the read depth at pharmacogenomic and risk-allele positions, so that a
      missing variant can be read as the reference allele.
    position: {left: 0, top: 1560}
  "Per-target coverage (mosdepth thresholds)":
    type: data
    format: [bed]
    optional: true
    doc: mosdepth thresholds BED over the exome targets (target bases at 10/20/30x).
    position: {left: 0, top: 1680}
  "Coverage summary (mosdepth)":
    type: data
    format: [tabular]
    optional: true
    doc: mosdepth summary over the exome targets (mean coverage, chrX/chrY for the sex check).
    position: {left: 0, top: 1800}
  "Coding-exon coverage (mosdepth thresholds)":
    type: data
    format: [bed]
    optional: true
    doc: mosdepth thresholds BED over coding exons with the gene name in column 4 (per-gene coverage).
    position: {left: 0, top: 1920}
  "Recurrent artefacts (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: >-
      Recurrent artefacts of the laboratory: alleles called in many of its own samples (same kit, sequencer and
      pipeline) but rare or absent in gnomAD, built with data/build_artefact_list.sh. The report marks matching
      calls low confidence; without it, recurrent false calls (e.g. in GC-rich targets) are not recognised.
    position: {left: 0, top: 2040}
  "Missense predictions (AlphaMissense BCF)":
    type: data
    format: [bcf, vcf_bgzip]
    doc: >-
      AlphaMissense hg38 predictions as an indexed BCF with INFO/AM_score, built with data/build_alphamissense.sh
      (CC BY 4.0), optionally joined with REVEL (INFO/REVEL, data/build_revel.sh; non-commercial use). All INFO
      fields of the file are transferred. Gives the missense PP3/BP4 evidence of the report at the ClinGen-calibrated
      strengths.
    position: {left: 0, top: 2160}
  "HPO disease annotations (phenotype.hpoa)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      HPO release file phenotype.hpoa: disease names, age of onset, clinical course and inheritance; with the
      patient's HPO terms, the report shows the disease that best explains the phenotype for each gene.
    position: {left: 0, top: 2280}
  "Dosage sensitivity (ClinGen TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      ClinGen gene curation list (https://ftp.clinicalgenome.org/ClinGen_gene_curation_list_GRCh38.tsv):
      haploinsufficiency and triplosensitivity scores, used to decide whether loss of function is a disease mechanism.
    position: {left: 0, top: 2400}
  "ClinVar missense by residue (TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      Pathogenic and benign ClinVar missense variants by protein residue, built from variant_summary.txt.gz with
      data/build_clinvar_protein.py: ACMG PS1 (same amino-acid change pathogenic) and PM5 (another pathogenic change
      at the residue).
    position: {left: 0, top: 2520}
  "Mother: variant calls (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: >-
      The mother's calls on the same reference, e.g. the Raw variant calls of the FASTQ workflow run on her reads.
      With both parents the report adds de novo variants, the parental origin of every finding, compound
      heterozygotes phased by origin and a parentage check.
    position: {left: 0, top: 2640}
  "Father: variant calls (VCF)":
    type: data
    format: [vcf, vcf_bgzip]
    optional: true
    doc: The father's calls on the same reference.
    position: {left: 0, top: 2760}
  "Mother: aligned reads (BAM)":
    type: data
    format: [bam]
    optional: true
    doc: The mother's BAM; confirms a de novo variant by her reference reads, and finds alleles her calls missed.
    position: {left: 0, top: 2880}
  "Father: aligned reads (BAM)":
    type: data
    format: [bam]
    optional: true
    doc: The father's BAM.
    position: {left: 0, top: 3000}
  "Affected parents":
    type: string
    default: unknown
    restrictions: [unknown, none, mother, father, both]
    doc: >-
      Whether a parent has the proband's condition (unknown, none, mother, father, both). A dominant candidate
      inherited from an unaffected parent does not count as fitting the inheritance.
    position: {left: 0, top: 3120}
  "Copy-number calls (wes_cnv TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      Deletions and duplications of the sample from the Exome CNV calls tool (the FASTQ workflow connects them):
      the report interprets them with ClinGen dosage, the ACMG/ClinGen CNV points and the genes' inheritance.
    position: {left: 0, top: 3240}
  "Copy-number summary (wes_cnv JSON)":
    type: data
    format: [json, txt]
    optional: true
    doc: Panel, noise, chromosome dosage (trisomy, monosomy) and sex chromosomes from read depth.
    position: {left: 0, top: 3360}
  "ClinGen dosage regions (TSV)":
    type: data
    format: [tabular, tsv, txt]
    optional: true
    doc: >-
      ClinGen region curation list (https://ftp.clinicalgenome.org/ClinGen_region_curation_list_GRCh38.tsv):
      recurrent CNV regions (e.g. 22q11.2) and population regions where dosage sensitivity is unlikely.
    position: {left: 0, top: 3480}
  "Mother: CNV per-target ratios":
    type: data
    format: [tabular]
    optional: true
    doc: The mother's per-target ratios from the Exome CNV calls tool; tells inherited from de novo CNVs.
    position: {left: 0, top: 3600}
  "Father: CNV per-target ratios":
    type: data
    format: [tabular]
    optional: true
    doc: The father's per-target ratios from the Exome CNV calls tool.
    position: {left: 0, top: 3720}
  "Previous report: findings (TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      The "Clinical findings (table)" of an earlier run on the same sample: the report then lists what is new,
      changed or no longer reported since, with the evidence that differs (reanalysis).
    position: {left: 0, top: 3840}
  "MANE transcripts (summary)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      MANE.GRCh38.v1.x.summary.txt.gz from NCBI: variants are named and classified on the MANE Select transcript,
      with the paired RefSeq NM_/NP_ names.
    position: {left: 0, top: 3960}
  "Curated gene-disease table":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen gene-disease validity, Gene2Phenotype and Orphanet merged by data/build_gene_disease.py: inheritance and
      disease mechanism per disease, and the disease-context section of the report.
    position: {left: 0, top: 4080}
  "ClinGen expert-panel rules (VCEP)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen CSpec criteria specifications built by data/build_vcep.py: the expert panels' gene-specific frequency
      cut-offs, criteria and strengths replace the default ACMG rules for their genes.
    position: {left: 0, top: 4200}
  "ClinGen expert-panel classifications (ERepo)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      ClinGen Evidence Repository classifications built by data/build_vcep.py, shown with their met criteria next to
      ClinVar.
    position: {left: 0, top: 4320}
  "Predicted dosage sensitivity (Collins TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      Collins et al. 2022 pHaplo/pTriplo scores (Collins_rCNV_2022.dosage_sensitivity_scores.tsv.gz, CC BY 4.0):
      predicted haploinsufficient and triplosensitive genes in a copy-number variant.
    position: {left: 0, top: 4440}
  "Functional assays (MaveDB TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      Calibrated multiplexed functional assays from MaveDB (CC0), built by data/build_mavedb.py: PS3/BS3 at the
      calibrated strength for the variants an assay measured.
    position: {left: 0, top: 4560}
  "Mitochondrial calls (wes_mito TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: The calls table of the Mitochondrial DNA variants tool (wes_mito) on the sample's reads.
    position: {left: 0, top: 4680}
  "Mitochondrial summary (wes_mito JSON)":
    type: data
    format: [json]
    optional: true
    doc: The summary of wes_mito (chrM coverage, detection limit, mixture check, MT-RNR1 depth).
    position: {left: 0, top: 4800}
  "Population CNVs (gnomAD exome CNV VCF)":
    type: data
    format: [vcf_bgzip, vcf]
    optional: true
    doc: >-
      gnomad.v4.1.cnv.all.vcf.gz (rare CNVs of 464,297 exomes, CC0): the population frequency of each CNV call.
    position: {left: 0, top: 4920}
  "Protein features (UniProt TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      UniProtKB/Swiss-Prot domains, regions, motifs and sites by Ensembl transcript, built by
      data/build_uniprot_features.py (CC BY 4.0): shown at each variant's residue.
    position: {left: 0, top: 5040}
  "gnomAD exome coverage (runs)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      gnomAD v4.0 exome coverage reduced to the exome regions by data/build_gnomad_sites.py coverage (CC0): an allele
      absent from gnomAD gets PM2 only where at least half of gnomAD exomes reached 20x.
    position: {left: 0, top: 5160}
  "Exon expression, pext (runs)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      gnomAD GTEx v10 base-level pext reduced to the exome regions by data/build_gnomad_sites.py pext (CC0): shown next
      to loss-of-function variants.
    position: {left: 0, top: 5280}
  "HLA types (wes_hla summary)":
    type: data
    format: [json]
    optional: true
    doc: >-
      The summary (JSON) of the HLA typing tool (wes_hla) on the sample's reads: HLA alleles, CPIC pharmacogenomic HLA
      alleles and HLA disease associations for the report.
    position: {left: 0, top: 5400}
  "HLA outside calls (PharmCAT TSV)":
    type: data
    format: [tabular]
    optional: true
    doc: >-
      The PharmCAT outside-call file of wes_hla (HLA-A and HLA-B diplotypes): PharmCAT then gives the HLA drug
      recommendations (abacavir, allopurinol, carbamazepine, oxcarbazepine, phenytoin).
    position: {left: 0, top: 5520}
  "Y haplogroup (wes_yhaplo summary)":
    type: data
    format: [json]
    optional: true
    doc: >-
      The summary (JSON) of the Y-chromosome haplogroup tool (wes_yhaplo) on the sample's reads: shown with the genetic
      sex (paternal lineage), with a warning when the Y result and the sex disagree.
    position: {left: 0, top: 5640}
  "KIR genes (wes_kir summary)":
    type: data
    format: [json]
    optional: true
    doc: >-
      The summary (JSON) of the KIR tool (wes_kir) on the sample's reads: KIR gene content, A/B genotype, B-content
      group and KIR-HLA ligand pairs for the report.
    position: {left: 0, top: 5760}

outputs:
  annotated_vcf:
    outputSource: functional_annotation/snpeff_output
  annotated_table:
    outputSource: annotated_table/output
  candidate_vcf:
    outputSource: prioritize/output
  candidate_table:
    outputSource: candidate_table/output
  snpeff_summary:
    outputSource: functional_annotation/statsFile
  snpeff_csv_stats:
    outputSource: functional_annotation/csvFile
  variant_stats:
    outputSource: variant_stats/output_file
  runs_of_homozygosity:
    outputSource: runs_of_homozygosity/output_file
  clinical_report:
    outputSource: clinical_report/report
  clinical_findings:
    outputSource: clinical_report/findings
  pharmcat_report:
    outputSource: pharmacogenomics/report
  pharmcat_calls:
    outputSource: pharmacogenomics/calls

steps:
  chrom_sizes:
    doc: Index the reference; the .fai provides chromosome lengths for padding.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_faidx/samtools_faidx/1.22+galaxy1
    tool_version: 1.22+galaxy1
    position: {left: 300, top: 120}
    in:
      input: "Reference genome (FASTA)"
    out:
      output: {hide: true}

  pad_targets:
    doc: Pad every target region on both sides (bedtools slop).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_slopbed/2.31.1+galaxy1
    tool_version: 2.31.1+galaxy1
    position: {left: 560, top: 240}
    in:
      inputA: "Exome target regions (BED)"
      genome_file_opts|genome: chrom_sizes/output
      addition|b: "Target padding (bp)"
    state:
      genome_file_opts:
        genome_file_opts_selector: hist
      pct: false
      strand: false
      addition:
        addition_select: b
      header: false
    out:
      output: {hide: true, rename: "Padded exome targets"}

  normalize:
    doc: >-
      Split multiallelic records, decompose complex alleles (MNVs, FreeBayes "complex" calls) into SNVs and
      indels so they match ClinVar/gnomAD, left-align/normalise indels, drop records with REF/reference mismatches.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_norm/bcftools_norm/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 300, top: 0}
    in:
      input_file: "Variant calls (VCF)"
      reference_source|fasta_ref: "Reference genome (FASTA)"
    state:
      reference_source:
        reference_source_selector: history
      check_ref: wx
      atomization: "--atomize"
      normalize_indels: true
      old_rec_tag: ""
      rm_dup: ""
      multiallelics:
        mode: "-"
        multiallelic_types: both
      sec_restrict:
        regions:
          regions_src: __none__
        targets:
          targets_src: __none__
      sec_default:
        site_win: 1000
        sort: pos
      sec_filter_norm:
        include: null
        exclude: null
      output_type: v
    out:
      output_file: {hide: true, rename: "Normalised variants"}

  target_filter:
    doc: Keep calls within the padded targets that satisfy the quality expression.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_filter/bcftools_filter/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 820, top: 0}
    in:
      input_file: normalize/output_file
      sec_restrict|regions|regions_file: pad_targets/output
      sec_restrict|include: "Quality filter (bcftools expression)"
    state:
      sec_restrict:
        regions:
          regions_src: regions_file
          regions_overlap: "1"
        targets:
          targets_src: __none__
        exclude: null
      sec_filter:
        SnpGap: null
        IndelGap: null
        mode: null
        conditional_soft_filter:
          selector: disabled
        select_set_GTs: null
      output_type: v
    out:
      output_file: {hide: true, rename: "On-target QC-passed variants"}

  clinvar_annotation:
    doc: Transfer ClinVar clinical significance (allele-specific match on CHROM, POS, REF, ALT).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_annotate/bcftools_annotate/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 1080, top: 0}
    in:
      input_file: target_filter/output_file
      sec_annofile|annofile|annotations: "ClinVar (VCF)"
    state:
      sec_annofile:
        columns: CLNSIG,CLNREVSTAT,CLNDN,CLNSIGCONF,ALLELEID,RS
        annofile:
          anno_fmt: vcf
        mark_sites: ""
        min_overlap: ""
        set_id: ""
      sec_annotate:
        remove: ""
      sec_restrict:
        include: null
        exclude: null
        collapse: null
        regions:
          regions_src: __none__
        samples: ""
        invert_samples: false
        invert_samples_file: false
      output_type: v
    out:
      output_file: {hide: true, rename: "ClinVar-annotated variants"}

  population_annotation:
    doc: >-
      Transfer the gnomAD v4.1 frequency fields (INFO/gnomAD_*; the caller's own INFO/AF is left intact), matched
      on CHROM/POS/REF/ALT.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_annotate/bcftools_annotate/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 1340, top: 0}
    in:
      input_file: clinvar_annotation/output_file
      sec_annofile|annofile|annotations: "Population allele frequencies (VCF)"
    state:
      sec_annofile:
        columns: gnomAD_AF,gnomAD_AN,gnomAD_nhomalt,gnomAD_grpmax,gnomAD_grpmax_AF,gnomAD_grpmax_AN,gnomAD_FAF95,gnomAD_FAF95_grp,gnomAD_filter,gnomAD_discordance_p
        annofile:
          anno_fmt: vcf
        mark_sites: ""
        min_overlap: ""
        set_id: ""
      sec_annotate:
        remove: ""
      sec_restrict:
        include: null
        exclude: null
        collapse: null
        regions:
          regions_src: __none__
        samples: ""
        invert_samples: false
        invert_samples_file: false
      output_type: v
    out:
      output_file: {hide: true, rename: "ClinVar+gnomAD-annotated variants"}

  missense_annotation:
    doc: Transfer the missense scores (INFO/AM_score, INFO/REVEL when present), matched on CHROM/POS/REF/ALT.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_annotate/bcftools_annotate/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 1340, top: 160}
    in:
      input_file: population_annotation/output_file
      sec_annofile|annofile|annotations: "Missense predictions (AlphaMissense BCF)"
    state:
      sec_annofile:
        columns: INFO
        annofile:
          anno_fmt: vcf
        mark_sites: ""
        min_overlap: ""
        set_id: ""
      sec_annotate:
        remove: ""
      sec_restrict:
        include: null
        exclude: null
        collapse: null
        regions:
          regions_src: __none__
        samples: ""
        invert_samples: false
        invert_samples_file: false
      output_type: v
    out:
      output_file: {hide: true, rename: "AlphaMissense-annotated variants"}

  splice_prediction:
    doc: >-
      SpliceAI delta scores (INFO/SpliceAI) for the rare variants (gnomAD AF and FAF95 < 1 % or absent); local tool
      tools/spliceai_score, install it on the Galaxy server (see README).
    tool_id: spliceai_score
    tool_version: 1.3.1+galaxy0
    position: {left: 1340, top: 320}
    in:
      input: missense_annotation/output_file
      reference: "Reference genome (FASTA)"
    state:
      annotation: grch38
      distance: 50
      mask: "0"
      processes: 32
    out:
      output: {hide: true, rename: "SpliceAI-annotated variants"}

  pharmacogenomics:
    doc: >-
      PharmCAT 3.4.0 star-allele diplotypes, phenotypes and CPIC/DPWG/FDA recommendations from the caller's VCF
      (local tool tools/pharmcat_pgx), with the HLA-A/B outside calls of wes_hla when given. Absent positions are not
      assumed to be reference.
    tool_id: pharmcat_pgx
    tool_version: 3.4.0+galaxy1
    position: {left: 2120, top: 480}
    in:
      input: "Variant calls (VCF)"
      outside_calls: "HLA outside calls (PharmCAT TSV)"
    state:
      absent_to_ref: false
      sources: null
    out:
      report: {rename: "PharmCAT report"}
      report_json: {hide: true}
      calls: {rename: "PharmCAT calls"}

  functional_annotation:
    doc: Predict variant effects (gene, consequence, impact, HGVS, LOF/NMD) with SnpEff.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/snpeff/snpEff/5.4+galaxy0
    tool_version: 5.4+galaxy0
    position: {left: 1600, top: 0}
    in:
      input: splice_prediction/output
      snpDb|snpeff_db: "SnpEff database"
    state:
      inputFormat: vcf
      outputFormat: vcf
      csvStats: true
      generate_stats: true
      generate_gene_stats: false
      snpDb:
        genomeSrc: history
        reg_section:
          regulation: null
      udLength: "0"
      spliceSiteSize: "2"
      spliceRegion:
        setSpliceRegions: "no"
      annotations: null
      filterOut: null
      filter:
        specificEffects: "no"
      chr: ""
      noLog: true
    out:
      snpeff_output: {rename: "Annotated variants (VCF)"}
      statsFile: {rename: "SnpEff summary"}
      csvFile: {change_datatype: csv, rename: "SnpEff stats (CSV)"}

  prioritize:
    doc: Select candidate variants with the prioritisation expression.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/snpsift/snpSift_filter/5.4.0c+galaxy1
    tool_version: 5.4.0c+galaxy1
    position: {left: 1860, top: 0}
    in:
      input: functional_annotation/snpeff_output
      filter_expression|expr: "Prioritization filter (SnpSift expression)"
    state:
      filter_expression:
        type: simple
      inverse: false
      filtering:
        mode: entries
    out:
      output: {rename: "Candidate variants (VCF)"}

  candidate_table:
    doc: One row per candidate variant (most severe SnpEff effect, ClinVar, gnomAD, genotype).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/snpsift/snpSift_extractFields/5.4.0c+galaxy1
    tool_version: 5.4.0c+galaxy1
    position: {left: 2120, top: 0}
    in:
      input: prioritize/output
    state:
      extract: >-
        CHROM POS ID REF ALT QUAL FILTER GEN[0].GT GEN[0].DP GEN[0].AD
        ANN[0].GENE ANN[0].FEATUREID ANN[0].EFFECT ANN[0].IMPACT ANN[0].HGVS_C ANN[0].HGVS_P
        LOF NMD gnomAD_AF gnomAD_grpmax_AF gnomAD_FAF95 gnomAD_nhomalt AM_score SpliceAI CLNSIG CLNREVSTAT CLNDN
      one_effect_per_line: false
      separator: ","
      empty_text: "."
    out:
      output: {rename: "Candidate variants (table)"}

  annotated_table:
    doc: One row per on-target variant with the same columns as the candidate table.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/snpsift/snpSift_extractFields/5.4.0c+galaxy1
    tool_version: 5.4.0c+galaxy1
    position: {left: 1860, top: 200}
    in:
      input: functional_annotation/snpeff_output
    state:
      extract: >-
        CHROM POS ID REF ALT QUAL FILTER GEN[0].GT GEN[0].DP GEN[0].AD
        ANN[0].GENE ANN[0].FEATUREID ANN[0].EFFECT ANN[0].IMPACT ANN[0].HGVS_C ANN[0].HGVS_P
        LOF NMD gnomAD_AF gnomAD_grpmax_AF gnomAD_FAF95 gnomAD_nhomalt AM_score SpliceAI CLNSIG CLNREVSTAT CLNDN
      one_effect_per_line: false
      separator: ","
      empty_text: "."
    out:
      output: {rename: "Annotated variants (table)"}

  variant_stats:
    doc: Variant statistics of the annotated on-target calls (MultiQC compatible).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_stats/bcftools_stats/1.24+galaxy0
    tool_version: 1.24+galaxy0
    position: {left: 1860, top: 400}
    in:
      input_file: functional_annotation/snpeff_output
    state:
      sec_restrict:
        samples: ""
        invert_samples: false
        invert_samples_file: false
        apply_filters: ""
        collapse: null
        regions:
          regions_src: __none__
        targets:
          targets_src: __none__
        include: null
        exclude: null
      sec_default:
        first_allele_only: false
        depth:
          set_depth: "no"
        reference_source:
          reference_source_selector: ""
        split_by_ID: false
        user_tstv: ""
        afbins:
          afbins_select: default
        af_tag: ""
        verbose: false
      plot_title: ""
    out:
      output_file: {rename: "Variant statistics (bcftools stats)"}

  runs_of_homozygosity:
    doc: >-
      Runs of homozygosity from the annotated exome calls (bcftools roh; population allele frequencies from
      INFO/gnomAD_AF, genotypes only, indels skipped). Long runs suggest parental relatedness or uniparental disomy.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bcftools_roh/bcftools_roh/1.24+galaxy1
    tool_version: 1.24+galaxy1
    position: {left: 1860, top: 600}
    in:
      input_file: functional_annotation/snpeff_output
    state:
      sec_general:
        AF_tag: gnomAD_AF
        GTs_only: 30.0
        skip_indels: true
      output_type: r
    out:
      output_file: {rename: "Runs of homozygosity (bcftools roh)"}

  clinical_report:
    doc: >-
      Human-readable clinical interpretation report and findings table (local tool tools/wes_clinical_report;
      install it on the Galaxy server, see README).
    tool_id: wes_clinical_report
    tool_version: 0.16.0+galaxy0
    position: {left: 2380, top: 300}
    in:
      vcf: functional_annotation/snpeff_output
      reference: "Reference genome (FASTA)"
      roh: runs_of_homozygosity/output_file
      pharmcat: pharmacogenomics/calls
      artefacts: "Recurrent artefacts (VCF)"
      gencc: "Gene-disease validity (GenCC TSV)"
      constraint: "Gene constraint (gnomAD TSV)"
      hpo_genes: "HPO gene annotations (phenotype_to_genes.txt)"
      hpo_terms: "Patient phenotype (HPO terms)"
      hpo_annotations: "HPO disease annotations (phenotype.hpoa)"
      clingen_dosage: "Dosage sensitivity (ClinGen TSV)"
      clinvar_protein: "ClinVar missense by residue (TSV)"
      mother_vcf: "Mother: variant calls (VCF)"
      father_vcf: "Father: variant calls (VCF)"
      mother_bam: "Mother: aligned reads (BAM)"
      father_bam: "Father: aligned reads (BAM)"
      affected_parents: "Affected parents"
      bam: "Aligned reads (BAM)"
      target_coverage: "Per-target coverage (mosdepth thresholds)"
      coverage_summary: "Coverage summary (mosdepth)"
      gene_coverage: "Coding-exon coverage (mosdepth thresholds)"
      cnv_calls: "Copy-number calls (wes_cnv TSV)"
      cnv_summary: "Copy-number summary (wes_cnv JSON)"
      clingen_regions: "ClinGen dosage regions (TSV)"
      mother_cnv: "Mother: CNV per-target ratios"
      father_cnv: "Father: CNV per-target ratios"
      previous_tsv: "Previous report: findings (TSV)"
      mane: "MANE transcripts (summary)"
      gene_disease: "Curated gene-disease table"
      vcep_rules: "ClinGen expert-panel rules (VCEP)"
      erepo: "ClinGen expert-panel classifications (ERepo)"
      collins_dosage: "Predicted dosage sensitivity (Collins TSV)"
      mave: "Functional assays (MaveDB TSV)"
      mito_tsv: "Mitochondrial calls (wes_mito TSV)"
      mito_json: "Mitochondrial summary (wes_mito JSON)"
      gnomad_cnv: "Population CNVs (gnomAD exome CNV VCF)"
      uniprot_features: "Protein features (UniProt TSV)"
      gnomad_coverage: "gnomAD exome coverage (runs)"
      pext: "Exon expression, pext (runs)"
      hla: "HLA types (wes_hla summary)"
      yhaplo: "Y haplogroup (wes_yhaplo summary)"
      kir: "KIR genes (wes_kir summary)"
    state:
      max_af: 0.01
      min_ref_depth: 15
      max_candidates: 60
    out:
      report: {rename: "Clinical interpretation report"}
      findings: {rename: "Clinical findings (table)"}
