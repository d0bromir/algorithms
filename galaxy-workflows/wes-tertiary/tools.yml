# Tool Shed repositories used by the WES workflows.
# Install with Ephemeris (https://ephemeris.readthedocs.io), in a virtual environment
# (system pip on Debian/Ubuntu refuses with "externally-managed-environment"):
#   python3 -m venv ~/ephemeris-venv && ~/ephemeris-venv/bin/pip install ephemeris
#   ~/ephemeris-venv/bin/shed-tools install -g http://192.168.191.12 -a <ADMIN_API_KEY> -t tools.yml
# No revisions are pinned, so the latest installable revision of each repository is installed.
# The workflows were built against: fastqc 0.74+galaxy1, fastp 1.4.0+galaxy0, bwa_mem 0.7.19+galaxy2,
# picard 3.1.1(.0), samtools_stats 2.0.9, samtools_faidx 1.22+galaxy2, mosdepth 0.3.14+galaxy0,
# freebayes 1.3.10+galaxy1, bedtools 2.31.1+galaxy1, bcftools 1.24+galaxy0, snpEff 5.4+galaxy0,
# SnpSift 5.4.0c+galaxy1, MultiQC 1.35+galaxy5.
install_tool_dependencies: false
install_repository_dependencies: true
install_resolver_dependencies: true
tools:
  # read QC, trimming, alignment
  - {name: fastqc, owner: devteam, tool_panel_section_label: "WES analysis"}
  - {name: fastp, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: bwa, owner: devteam, tool_panel_section_label: "WES analysis"}
  - {name: picard, owner: devteam, tool_panel_section_label: "WES analysis"}
  - {name: samtools_stats, owner: devteam, tool_panel_section_label: "WES analysis"}
  - {name: samtools_faidx, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: mosdepth, owner: iuc, tool_panel_section_label: "WES analysis"}
  # variant calling and tertiary analysis
  - {name: freebayes, owner: devteam, tool_panel_section_label: "WES analysis"}
  - {name: bedtools, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: bcftools_norm, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: bcftools_filter, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: bcftools_annotate, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: bcftools_stats, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: snpeff, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: snpsift, owner: iuc, tool_panel_section_label: "WES analysis"}
  - {name: multiqc, owner: iuc, tool_panel_section_label: "WES analysis"}
  # helpers for preparing reference data (not used inside the workflows)
  - {name: bcftools_view, owner: iuc, tool_panel_section_label: "WES analysis"}
